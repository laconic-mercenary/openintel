<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">No camera detected</title>
  <desc id="desc">A gray camera icon crossed with an X on a parchment map style background.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3d5b7" />
      <stop offset="0.5" stop-color="#cdbb93" />
      <stop offset="1" stop-color="#b5a07a" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12" />
      </feComponentTransfer>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#7f6b47" stroke-width="1" opacity="0.25" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1f1910" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#paper)" />
  <rect width="1280" height="720" fill="url(#grid)" />
  <rect width="1280" height="720" filter="url(#grain)" />
  <rect x="24" y="24" width="1232" height="672" rx="10" fill="none" stroke="#5e4d31" stroke-width="8" opacity="0.85" />
  <rect x="36" y="36" width="1208" height="648" rx="8" fill="none" stroke="#8e7751" stroke-width="2" opacity="0.8" />

  <g opacity="0.35" fill="none" stroke="#6f5c3d" stroke-width="4">
    <path d="M170 165c75-32 148 20 226 0s115-89 203-56" />
    <path d="M720 154c71-20 107 26 173 15s113-66 180-30" />
    <path d="M135 560c90-45 177 32 286 4s123-94 230-52" />
    <path d="M760 548c58-22 118 6 185-13s81-49 148-22" />
  </g>

  <g transform="translate(640 360)" filter="url(#shadow)">
    <rect x="-210" y="-120" width="420" height="240" rx="28" fill="#68707a" stroke="#2e3339" stroke-width="10" />
    <rect x="-110" y="-164" width="145" height="56" rx="12" fill="#7d8792" stroke="#2e3339" stroke-width="10" />
    <circle cx="20" cy="0" r="78" fill="#4d545d" stroke="#2e3339" stroke-width="10" />
    <circle cx="20" cy="0" r="38" fill="#2f343b" stroke="#8b949e" stroke-width="6" />
    <circle cx="145" cy="-58" r="12" fill="#8b949e" />
  </g>

  <g stroke-linecap="round" stroke="#7b1e14" stroke-width="26" opacity="0.95" filter="url(#shadow)">
    <line x1="455" y1="175" x2="825" y2="545" />
    <line x1="825" y1="175" x2="455" y2="545" />
  </g>

  <text x="640" y="640" text-anchor="middle" fill="#3f3220" font-size="44" font-family="Georgia, serif" letter-spacing="1.5">
    NO CAMERA DETECTED
  </text>
</svg>
