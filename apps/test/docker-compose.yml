services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    command: "azurite-table --tableHost 0.0.0.0"
    ports:
      - "10002:10002"
    networks:
      - roverapi-net

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    networks:
      - roverapi-net

  authapi:
    build:
      context: ../roverapi
      dockerfile: Dockerfile.authapi
    ports:
      - "8080:8080"
    environment:
      ROVERAPI_AUTH_TABLE_CONN_STR: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      ROVERAPI_AUTH_TABLE_NAME: "openintelauth"
      ROVERAPI_AUTH_EMAIL_HASH_PEPPER: "your-pepper-here-change-in-production"
      ROVERAPI_AUTH_ENCRYPTION_SALT_PEPPER: "your-salt-pepper-here-change-in-production"
      ROVERAPI_AUTH_ALLOWED_DOMAINS: "http://localhost:8085,http://localhost:3000,http://localhost:8080"
      ROVERAPI_AUTH_COOKIE_EXPIRY_SECS: "86400"
      ROVERAPI_AUTH_JWT_SECRET: "your-jwt-secret-must-be-at-least-32-bytes-long"
      ROVERAPI_AUTH_EMAIL_LOGIN_DOMAIN: "http://localhost:8080"
      ROVERAPI_AUTH_LOGIN_REDIRECT_URL: "http://localhost:8085"
      ROVERAPI_AUTH_LOGIN_CODE_SENDER: "noreply@example.com"
      ROVERAPI_AUTH_LOGIN_CODE_EXPIRY: "300"
      ROVERAPI_AUTH_RATELIMITER_ATTEMPTS: "5"
      ROVERAPI_AUTH_RATELIMITER_WINDOW: "60"
      ROVERAPI_AUTH_RATELIMITER_DISABLE_DURATION: "1800"
      ROVERAPI_AUTH_ARGON2_MEMORY: "65536"
      ROVERAPI_AUTH_ARGON2_ITERATIONS: "3"
      ROVERAPI_AUTH_ARGON2_PARALLELISM: "2"
      ROVERAPI_AUTH_ARGON2_SALT_LENGTH: "16"
      ROVERAPI_AUTH_ARGON2_KEY_LENGTH: "64"
    networks:
      - roverapi-net

  roverapi:
    build:
      context: ../roverapi
      dockerfile: Dockerfile.roverapi
    ports:
      - "8081:8081"
    environment:
      ROVERAPI_LOG_LEVEL: "debug"
      ROVERAPI_AUTH_JWT_SECRET: "your-jwt-secret-must-be-at-least-32-bytes-long"
      ROVERAPI_ROVER_TABLE_CONN_STR: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      ROVERAPI_ROVER_PRIVATE_INTEL_TABLE_NAME: "openintelprivateintel"
      ROVERAPI_ROVER_INTEL_EMAIL_HASH_PEPPER: "your-intel-email-hash-pepper-change-in-production"
      ROVERAPI_ROVER_TIMESTAMP_PEPPER: "your-timestamp-pepper-change-in-production"
      ROVERAPI_ROVER_TIMESTAMP_SECRET_BASE: "9999999999999999"
      ROVERAPI_ROVER_STORE_ENDPOINT: "http://minio:9000"
      ROVERAPI_ROVER_STORE_PUBLIC_ENDPOINT: "http://localhost:9000"
      ROVERAPI_ROVER_STORE_BUCKET: "intel"
      ROVERAPI_ROVER_STORE_ACCESS_KEY: "minioadmin"
      ROVERAPI_ROVER_STORE_SECRET_KEY: "minioadmin"
      ROVERAPI_ROVER_ALLOWED_ORIGINS: "http://localhost:8085,http://localhost:3000"
    networks:
      - roverapi-net
    depends_on:
      - authapi
      - azurite
      - minio

  rover-ui:
    build:
      context: ../rover
      dockerfile: Dockerfile
    ports:
      - "8085:80"
    networks:
      - roverapi-net
    depends_on:
      - authapi
      - roverapi

networks:
  roverapi-net:
    driver: bridge
